groups:
  - name: astock_db_stale
    rules:
      # [2026-09-22 重做] 原规则是**单一 24h 阈值打所有表**, 这是设计错误:
      #   · `financials` 是**季度**表 —— 实测最后一日 2026-06-30(84.9 天前),
      #     而那是**财报的正常节奏**, 永远超 24h ⇒ **永久假阳性**;
      #   · `daily_bars` 是每日表, 24h 又**太松**(一次漏更不会在一天内暴露)。
      #   实测后果: 该规则自 09-08 起 **firing 330 次**, 长期无人处理 ——
      #   而**长期无人处理的告警等于没有告警**(它训练人忽略这个频道),
      #   与 obs_stack 那条常亮 OVERDUE 同源。
      # 判据改为**按更新节奏分档**: 日报类 5 天(留出周末+一个容错交易日),
      # 季报类 120 天(一个季度 + 缓冲)。阈值来自"该表**本该**多久更新一次",
      # 而不是一刀切 —— 与本仓 METHOD-1(判据须基于下游真实语义)一致。
      - alert: TableStaleDaily
        # 日报类表(每交易日应更新)
        expr: >-
          (time() - astock_db_lastday_ts) / 86400 > 5
          and astock_db_lastday_ts > 0
          and astock_db_lastday_ts{table=~"daily_bars|valuation|valuation_snapshot|margin_daily|money_flow_estimate|northbound_money"}
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "日报类表 {{ $labels.table }} 已超过 5 天未更新"
          description: >-
            astock_db_lastday_ts 距今超过 5 天(留出周末与一个容错交易日)。
            查 data/datasource_health.jsonl 的 db_update 连续失败原因,
            以及 data/health/state.json 的 observed.datasource。

            【已知状态 · 2026-09-22 登记】若告警表是 valuation / valuation_snapshot /
            money_flow_estimate 这三张, 则为**已登记的已知状态, 不是新故障**:
            它们停在 2026-09-08(14.9 天), 属上游数据源问题 ——
            见 docs/stockdb-source-status.md 与登记 P0-DB-UPDATE-ALL-TABLES-FAIL。
            处置: 该告警**保留为 warning**(不用 silence 盖掉) —— 因为它同时覆盖
            真正需要人看的表(daily_bars 等); 收到时按上表判断是否属已知三张,
            属则记录后关闭, 不属则按新故障处理。

      - alert: TableStaleQuarterly
        # 季报类表(财报节奏) —— **刻意与日报类分开**: 用 24h 判它必然永久误报
        expr: >-
          (time() - astock_db_lastday_ts) / 86400 > 120
          and astock_db_lastday_ts > 0
          and astock_db_lastday_ts{table=~"financials"}
        for: 6h
        labels:
          severity: warning
        annotations:
          summary: "季报类表 {{ $labels.table }} 已超过 120 天未更新"
          description: >-
            financials 为季度表, 正常节奏约 90 天一期; 超过 120 天说明
            **连续两个报告期未入库**, 需查同步链路(不是"今天没拉到")。

  # 融合口径降级告警 (2026-09-19)
  #   背景: fusion 覆盖跌破 MIN_COVERAGE(0.80) 时会回退 f_ml; 而 f_ml 曾因数据湖
  #   (E:\A_stockDB\stockdb.duckdb) 退役整条断链, 最终静默退化到 used=equal ——
  #   排序完全不含融合加成, 且只有一条 WARNING 日志, 实盘无人察觉。
  #   现由 factor_fusion._record_fusion_state 落盘 fusion_health.json,
  #   metrics_server 暴露 astock_fusion_degraded / astock_fusion_used, 此处告警。
  - name: astock_fusion_health
    rules:
      - alert: FusionDegraded
        expr: astock_fusion_degraded > 0
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "融合口径已降级 (排序失去融合加成)"
          description: >-
            astock_fusion_degraded={{ $value }}: fusion_or_fml 未能走 fusion,
            已回退 fml_fallback 或 equal。请查 data/fusion_health.json 的
            used/coverage/degrade_reason, 以及 data/fusion_degradation.jsonl 的留痕。
      - alert: FusionStale
        # 选股链路长时间未刷新融合健康度 = 调度中断或选股未跑
        expr: (time() - astock_fusion_checked_ts) / 86400 > 3 and astock_fusion_checked_ts > 0
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "融合口径健康度已超过 3 天未刷新"
          description: "astock_fusion_checked_ts 距今超过 3 天, 请检查选股/调度链路是否在跑"
      - alert: FusionHealthUnreadable
        # [2026-09-19 复验发现] 健康度文件读失败时, 其余 gauge 会保留上一次的"健康"值,
        # 导致 FusionDegraded 永远不会触发 —— 告警源自身失效却无人知晓。
        # 实测触发条件: 文件被写成带 BOM 的 UTF-8(PowerShell Set-Content -Encoding UTF8)。
        expr: astock_fusion_health_read_ok == 0
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "融合健康度文件不可读 (告警源已失效)"
          description: >-
            astock_fusion_health_read_ok=0: metrics_server 无法解析
            data/fusion_health.json, astock_fusion_* 各指标可能停留在过期值,
            FusionDegraded 因此可能漏报。请检查该文件编码(需 UTF-8/UTF-8-BOM)
            与内容是否为合法 JSON。

  # DRL 降级 / 暂停交易告警 (2026-09-20, 用户决策 D)
  #   背景: DRL 训练需要 h5i_db 与 torch 在**同一解释器**; 实测两者分处互斥环境
  #   (.venv314 有 torch 无 h5i_db; 唯一 3.10 有 h5i_db 无 torch), 故 DRL 暂不在
  #   生产运行。用户决策 D 要求: **响亮地置 L3、不生成新信号**, 而不是静默失败。
  #   由 run_daily 的环境门禁调用 drl_degrade.force_halt 落盘账本,
  #   metrics_server 暴露 astock_drl_* 指标, 此处负责告警。
  - name: astock_drl_degrade
    rules:
      - alert: DrlHalted
        # L3 = 暂停交易: 当日**未生成新信号**。这是需要人工介入的状态。
        expr: astock_drl_degrade_level >= 3
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "DRL 已暂停交易 (L3, 当日未生成新信号)"
          description: >-
            astock_drl_degrade_level={{ $value }}: DRL 处于 L3。若因运行环境缺依赖,
            请查 astock_drl_env_ok(=0 表示缺 torch/h5i_db/gymnasium/stable_baselines3),
            以及 data/drl_degrade_events.jsonl 最近一条的 trigger 字段。
            在环境恢复前, 当日 target_plan 不会产出, 盘中引擎将回退 selection 档。
      - alert: DrlDegraded
        # L1/L2 = 保留旧模型 / 回退上一版: 当日仍会跑, 但用的不是新训练的模型。
        expr: astock_drl_degrade_level > 0 and astock_drl_degrade_level < 3
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "DRL 已降级 (使用非当日模型)"
          description: >-
            astock_drl_degrade_level={{ $value }}: DRL 处于 L1(保留旧模型) 或
            L2(回退上一有效版本)。请查 data/drl_degrade_events.jsonl 的 trigger 与
            effective_source_day, 确认回退到的模型是否仍可用。
      - alert: DrlEnvMissing
        # 决策 D 的根因暴露: 运行环境不齐备 => run_daily 会显式置 L3。
        expr: astock_drl_env_ok == 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "DRL 运行环境缺依赖 (将导致显式 L3)"
          description: >-
            astock_drl_env_ok=0: 当前解释器缺少 h5i_db 与 torch 之一(或 gymnasium/
            stable_baselines3)。注意 h5i_db 仅支持 CPython 3.10, 而 torch 侧在 3.14,
            故需按登记册 P0-DRLDEP 的四条路径之一决策后才可能齐备。
      - alert: DrlDegradeStatusUnreadable
        # 与 FusionHealthUnreadable 同理: 读数失败会让其余 astock_drl_* 停留在过期值,
        # 使 DrlHalted 漏报 —— 告警源自身失效必须显式暴露。
        expr: astock_drl_degrade_read_ok == 0
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "DRL 降级状态不可读 (告警源已失效)"
          description: >-
            astock_drl_degrade_read_ok=0: metrics_server 无法读取 DRL 降级状态
            (data/drl/current_model.json 指针与 data/drl_degrade_events.jsonl 账本),
            astock_drl_* 各指标可能停留在过期值, DrlHalted 因此可能漏报。

      - alert: DataSourceHalt
        # [2026-09-22] 数据源健康门禁判定 HALT: 连续 FAILS_TO_HALT 轮同一原因失败
        # (厂商引擎不可达 / 数据落后超硬阈值 / db_update 全表失败 / 同步假成功)。
        # 为什么是 critical: 2026-09-22 的真实故障链是"引擎没跑 -> 引擎静默停摆 ->
        # 直到收盘才发现今天没有新数据", 而症状与"今天是节假日"无法区分。
        # 门禁已跳过摄入与选股, 但**必须有人知道**, 否则它只是一次静默停手。
        expr: astock_datasource_allow == 0
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "数据源健康门禁 HALT (已停止摄入与选股)"
          description: >-
            astock_datasource_level=2: 数据源连续失败达阈值, run_daily 已跳过摄入与
            选股(持仓归档照常)。查 data/datasource_health.jsonl 看连续失败原因,
            以及 data/health/state.json 的 observed.datasource.reasons。
            常见: 服务 AStockStockdb 停止 / 厂商未发布 / db_update 表级全失败。

      - alert: EngineDataLag
        # [2026-09-25 新增] 厂商引擎的数据落后**交易日**数 —— 覆盖 2~3 天这段
        # 「正在静默降级」的窗口。这是实测出来的缺口, 不是预防性添加:
        #
        # 当时引擎停在 2026-09-22, 应到 09-24 ⇒ 落后 **2 个交易日**, 而:
        #   · `DataSourceHalt` 只在 `astock_datasource_allow == 0` 时响, 而门禁的
        #     降级判据(落后 > 发布宽限 1 个交易日)只让它到 **DEGRADED**、`allow` 仍为 1
        #     ⇒ **不响**;
        #   · `TableStaleDaily` 阈值是 **5 个自然日**, 而实测 `daily_bars` 才 3.08 天
        #     ⇒ 要等到第 6 天才响。
        # 于是「厂商连续几天没发数据」这件事**完全没有告警** ——
        # 而它正是本仓反复出现的形态: 系统在**正确地降级**, 却没人知道。
        #
        # 阈值 1 而非 0: 0 表示已追平; 1 表示还差一个已收盘交易日 —— 那在 A 股
        # 盘后 1~4 小时才发布数据的现实下**属正常发布延迟**, 不该叫。
        # 2 起才是"厂商可能漏发了", 故用 `> 1` 与门禁的
        # `ENGINE_LAG_HALT_TRADING_DAYS`/`PUBLISHER_GRACE_TRADING_DAYS` 对齐。
        #
        # `for: 30m` 而非 0: 健康快照每 ~5 分钟发布一次, 单次探针抖动不该叫。
        expr: astock_engine_lag_days > 1
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "厂商引擎数据落后 {{ $value }} 个交易日 (正在静默降级)"
          description: >-
            astock_engine_lag_days={{ $value }}: 厂商引擎最新数据日 vs 应有数据日
            相差 {{ $value }} 个交易日。此时选股仍在跑, 但用的是**旧截面** ——
            看 data/daily/<最新回执>/daily_summary.json 的
            steps.engine_bars_sync(engine_last_day) 与 target_plan.json 的
            section_as_of / data_lag_days 即可确认"用哪天的数据在做决策"。
            处置: 这是**厂商侧**发布问题, 本仓无法补 —— 先确认
            `AStockStockdb` 服务在跑(它活着但没新数据 ≠ 它挂了);
            落后达 3 个交易日时门禁会自行 HALT 并改为 DataSourceHalt 告警。

      - alert: EngineDataLagUnreadable
        # 与 DataSourceGateUnreadable 同理: 读不到落后结论时上面那条会哑掉
        # (旧版快照没有 lag_trading_days 字段), 必须显式暴露, 否则"没有告警"
        # 与"没有在监控"不可区分。
        expr: astock_engine_lag_read_ok == 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "引擎落后结论不可读 (告警源已失效)"
          description: >-
            metrics_server 读不到 data/health/state.json 的 observed.lag_trading_days
            (快照为旧版本, 或引擎探针失败) => EngineDataLag 可能漏报。
            查 daemon 日志的"健康快照已发布"是否仍在出现, 以及快照里有没有
            observed.engine_error / probe_error_kind。

      - alert: DataSourceGateUnreadable
        # 与 FusionHealthUnreadable / DrlDegradeStatusUnreadable 同理: 读数失败会
        # 让 astock_datasource_* 停留在过期值, 使 DataSourceHalt 漏报 ——
        # 告警源自身失效必须显式暴露。
        expr: astock_datasource_read_ok == 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "数据源门禁结论不可读 (告警源已失效)"
          description: >-
            metrics_server 读不到 data/health/state.json 的 observed.datasource
            (快照缺失或为旧版本) => DataSourceHalt 可能漏报。

      - alert: DeadmanOverdue
        # [2026-09-22] 死手开关 OVERDUE: 有组件超过 3× 周期没有 tick。
        # 为什么这条特别重要: 其它所有监控(心跳/看门狗/健康快照)都要求
        # **监测者自己还活着**, 只有它判的是"本该出现的 tick 没出现" ——
        # 失联本身即是证据。而它此前**只被喂 tick、从不被求值**
        # (全仓检索 deadman_switch.verdict 零命中), 于是本仓唯一一个
        # 不依赖监测者存活的机制, 恰恰是唯一没接线的那个。
        # 当天实测: daemon 从 12:25 起消失 4.6 小时(机器 16:08 重启), 全系统零告警;
        # 手工跑一次 verdict() 立刻得到 OVERDUE(obs_stack 已 66866s 无 tick)。
        expr: astock_deadman_overdue > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "死手开关 OVERDUE (有组件已停摆)"
          description: >-
            data/health/state.json 的 observed.deadman.overdue 非空: 有注册组件的
            tick 超过 3× 标称周期没出现。查 data/deadman_ticks.jsonl 按 component
            分组看最后 tick 时间, 对照 data/deadman_registry.json 的 period_s。
            注意: 这可能意味着**监测者与被监测者一起消失**(2026-09-22 即如此),
            故同时确认 daemon 自身是否在跑。

      - alert: DeadmanNeverArmed
        # 账本为空 = 这套监控**从未生效**。刻意单独一条而不是并进上面那条:
        # "没有告警"与"没有在监控"必须可区分 —— 这正是该模块自己的立场
        # (verdict 的 UNKNOWN 档不取 OK)。
        expr: astock_deadman_unknown > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "死手开关从未生效 (账本为空, 不等于健康)"
          description: >-
            astock_deadman_unknown > 0: data/deadman_ticks.jsonl 为空或没有任何
            组件的 tick, 死手开关处于 UNKNOWN —— 它不会发现任何失联。
            修复: 确认 daemon/realtime_engine 在调用 deadman_switch.beat(),
            必要时用 `python src/deadman_switch.py --flush-percent 1` 打底。

      - alert: DeadmanUnreadable
        # 告警源自身失效: 读不到 observed.deadman 时上面两条都会哑掉
        # (与 DataSourceGateUnreadable 同一纪律)。
        expr: astock_deadman_read_ok == 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "死手开关结论不可读 (告警源已失效)"
          description: >-
            metrics_server 读不到 data/health/state.json 的 observed.deadman
            (快照缺失或为旧版本) => DeadmanOverdue / DeadmanNeverArmed 可能漏报。

  - name: astock_scrape_health
    rules:
      - alert: MetricsTargetDown
        # [2026-09-23 新增] 本文件此前**全部**规则都建立在"9101 还能被抓到"之上,
        # 却没有一条规则检查这件事本身。2026-09-23 00:31 实测到了后果:
        # 手工停掉 metrics_server 重启换代码时, 9101 停止被抓, 于是
        # `astock_db_lastday_ts` 等序列消失, **00:32:51 alert_hook 记下三条
        # `resolved`** —— 而那三张表(valuation / valuation_snapshot /
        # money_flow_estimate)**一张都没有更新**。
        #
        # 为什么这比"某条规则写错"危险: 数据源死了以后系统发出的信号是**由红转绿**。
        # Alertmanager 只会把"firing -> 消失"解释为 **resolved**, 于是下游(人/钉钉)
        # 收到的唯一消息是"故障已恢复"。本仓铁律是"宁可响亮停手, 不可静默降级",
        # 而这里连"停手"都没有 —— 是**假恢复**。
        #
        # 为什么 `for: 10m` 而不是 0: 上面那条实测是我**主动重启**造成的, 属正常运维
        # (daemon 的 `_ensure_obs_stack()` 也会在约 19 分钟内自愈)。10 分钟把"主动重启"
        # 与"真的死了"分开 —— 与 `FAILS_TO_HALT=3`(连续 N 次才停手)同一条纪律:
        # 判据要扛得住单次抖动, 否则会训练人忽略这个频道。
        #
        # `up` 由 Prometheus 自己对每次抓取生成, **不经过 metrics_server** ——
        # 这正是它能覆盖"被监控者已死"的原因: 它不需要 9101 还活着才能取到值。
        expr: up{job="astock-db"} == 0
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "metrics_server (9101) 已停止被抓取 —— 本文件其余告警**全部失效**"
          description: >-
            up{job="astock-db"} == 0: Prometheus 连续 10 分钟抓不到 127.0.0.1:9101。
            后果**不是"少了一路指标", 而是本文件里每一条告警都同时失效**, 且已经
            firing 的告警会被 Alertmanager 报成 resolved(看起来像故障恢复)。
            处置: 查 9101 是否在听(`Get-NetTCPConnection -LocalPort 9101`)、
            `python src/metrics_server.py --port 9101` 能否手工起来;
            daemon 的 `_ensure_obs_stack()` 约 19 分钟会自愈, 若没自愈则查 daemon 是否还活着
            (两者同时消失是本条也覆盖不到的情形 —— 那时看 logs/daemon.log)。
