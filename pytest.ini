# -*- coding: utf-8 -*-
# pytest 根配置 (2026-09-23 新增)。
#
# 为什么需要这个文件 —— 一次**真实**的事故, 不是预防性配置:
#
#   本仓此前**没有任何 pytest 配置文件** ⇒ 收集范围完全靠 pytest 的默认递归。
#   而 `data/` 下有一个隔离目录 `data/_quarantine/tmp_scripts_20260922/`,
#   里面留着一次性排查脚本 `_tmp_fork_test.py`。它**恰好匹配 pytest 默认的
#   `*_test.py` 收集模式**, 于是执行 `pytest -q`(不带路径)时:
#
#     1. pytest 试图 import 它;
#     2. 它需要 `h5i_db`(只在 .venv310/生产解释器里有, .venv314 没有);
#     3. `ModuleNotFoundError: No module named 'h5i_db'` ⇒ **收集中断**;
#     4. 结果: `Interrupted: 1 error during collection` ——
#        **2301 个测试一个都没跑**, 而想跑全量的人看到的是一条"no module"错误。
#
#   **更值得记的是它为什么能潜伏**: 我此前每次都显式传路径
#   (`pytest tests/test_xxx.py`), 于是这条路径**从未被走到**。
#   这与本仓 DISC-2 是同一形态 —— 「没人跑到」与「跑到了没问题」不可区分,
#   而"顺手不带参数跑一次全量"恰恰是最容易发生的用法。
#
#   **并且它危险的方式不止一种**: 该文件是**顶层脚本**(没有 test_ 函数),
#   一旦 import 成功, 它会在收集阶段**真的执行**: 建临时库、create_fork、
#   append、restore、最后 shutil.rmtree。收集阶段不该产生副作用。
#
# 判据: 测试**只**从 `tests/` 收集。`testpaths` 只在不带路径调用时生效
# (显式传路径仍按传入的来 —— 这是 pytest 的语义, 也符合直觉)。
# 同时把 `data` 放进 norecursedirs 兜底: 它是**运行时数据目录**,
# 隔离区/归档随时可能再落进任何名字像测试的脚本。
[pytest]
testpaths = tests
norecursedirs = data .git __pycache__ .pytest_tmp node_modules _merge_workspace
# `-ra` 让 skip 的原因在概要里可见。本仓有多处"因环境缺依赖而 skip"的用例
# (PyYAML / baostock / h5i_db), 而 pytest 默认把 skipped 和 passed 都显示为通过 ——
# 见 docs/disciplines.md DISC-2「skip 被读成通过」。
addopts = -ra
