# ============================================================
# CI: 全量回归
#   regression-core : 不依赖 torch/DRL 的全部测试(含 IC 门控/滑点/加权融合/
#                     因子健康/归因/风控配置/执行分解 等), 多 Python 版本矩阵
#   regression-drl  : 依赖 torch + stable-baselines3 + gymnasium 的 DRL 测试
# 说明: 本地开发环境为 Python 3.14(.venv314 + requirements_314.txt);
#       CI 使用 3.11/3.12 以获得最完整的 wheel 覆盖。
# ============================================================
name: ci-regression

on:
  push:
    branches: [main]
  pull_request:

jobs:
  regression-core:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          # [2026-09-19 修] 原为 `pip install -r requirements_314.txt pytest`。
          # requirements_314.txt 只是**核心**依赖(10 项), 而测试链还会 import:
          #   duckdb  -> src/db.py 顶层依赖(requirements-dev.txt 已注明"测试环境必备")
          #   polars  -> src/vnpy_backtest.py 顶层依赖(tests/test_calendar_fallback.py 会 import 它)
          # 缺这两个 ⇒ 凡 import db / vnpy_backtest 的测试模块在**收集阶段**即
          # ImportError, pytest 以 exit code 2 中断(表现为"1 秒内失败", 而非测试失败)。
          # 实测 origin/main 基线 48ccf7f(不含任何本会话改动) 同样 exit 2 ⇒ 既有缺陷。
          # 此处补齐 author 已在 requirements-dev.txt 中标注的测试环境依赖。
          # metrics_server 的契约测试需要 Prometheus 客户端；它已在
          # requirements-dev.txt/requirements-lock.txt 声明，这里显式安装
          # 最小测试运行时依赖，避免把整套开发依赖带进 CI。
          pip install -r requirements_314.txt pytest duckdb polars prometheus_client
      - name: Run full regression (excluding torch/DRL suites)
        run: |
          python -m pytest tests -q \
            --ignore=tests/test_drl_factor_state_h5i.py \
            --ignore=tests/test_drl_target_plan_h5i.py \
            --ignore=tests/test_factor_dynamic_weights.py \
            --ignore=tests/test_factor_value_env.py \
            --ignore=tests/test_factor_weight_env_bounds.py \
            --ignore=tests/test_llm_drl_integration.py \
            --ignore=tests/test_regime_aware.py \
            --ignore=tests/test_risk_factor_integration.py \
            --ignore=tests/test_risk_factor_optimizer.py \
            --ignore=tests/test_run_factor_value_drl_risk.py \
            --ignore=tests/test_cvar_config.py \
            --ignore=tests/test_execution_decomposition.py

  regression-drl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps (CPU torch)
        run: |
          python -m pip install --upgrade pip
          # 与 regression-core 同样补齐 requirements-dev.txt 已注明的顶层依赖
          pip install -r requirements_314.txt pytest duckdb polars
          pip install gymnasium
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install stable-baselines3
      - name: Run DRL regression
        run: |
          # [2026-09-19] 并入两处 torch 依赖用例(原先遗漏在 core job 里, 而 core 按设计
          # 不装 torch ⇒ 必然 ModuleNotFoundError: gymnasium/torch):
          #   tests/test_cvar_config.py            -> 经 drl_train 间接依赖 torch
          #   tests/test_execution_decomposition.py-> risk_factor_optimizer -> drl_train -> torch
          # core job 已对应 --ignore, 故两处仍被完整覆盖, 只是移到有 torch 的 job 执行。
          # [2026-09-20] 新增 tests/test_factor_weight_env_bounds.py -> 需 gymnasium+torch
          #   （FactorWeightEnv 回合终止边界 + _load_factor_state 失败路径; core 同步 --ignore）
          # [2026-09-20] 新增 tests/test_drl_factor_state_h5i.py -> 经 drl_train 依赖 torch
          #   （P0-DRLSRC 迁移回归: 不得再碰 DUCKDB_PATH + inner-join 口径 + 单次批量查询;
          #    用假 store, 故 CI 无需 h5i_db; core 同步 --ignore）
          python -m pytest tests/test_drl_factor_state_h5i.py \
            tests/test_drl_target_plan_h5i.py \
            tests/test_factor_dynamic_weights.py \
            tests/test_factor_value_env.py \
            tests/test_factor_weight_env_bounds.py \
            tests/test_llm_drl_integration.py \
            tests/test_regime_aware.py \
            tests/test_risk_factor_integration.py \
            tests/test_risk_factor_optimizer.py \
            tests/test_run_factor_value_drl_risk.py \
            tests/test_cvar_config.py \
            tests/test_execution_decomposition.py \
            -q

  regression-h5i:
    name: h5i integration (Python 3.10)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install h5i test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_314.txt pytest duckdb polars
          # h5i_db 的原生扩展不在 Python 3.14 核心环境中；该 job
          # 专门验证 h5i 临时库写入与等价性路径，避免 CI 只验证 skip 分支。
          pip install "h5i-db>=0.1.6"
          # 与 canonical Python 3.10 runtime 保持执行依赖可探测。
          pip install "vnpy==4.4.0"
      - name: Verify h5i_db is available
        run: python -c "import h5i_db; print(h5i_db.__file__)"
      - name: Verify h5i execution runtime
        run: python -c "import h5i_db, vnpy; print('h5i-runtime=ok')"
      - name: Run h5i integration regression
        run: |
          python -m pytest \
            tests/test_baostock_backfill.py \
            tests/test_h5i_accel_equivalence.py \
            -q -rs
      - name: Run signal freeze regression with h5i enabled
        run: |
          # Core job 会在无 h5i 的环境中运行这些测试；这里补一轮 h5i-enabled
          # 运行，避免 factor_fusion/target_weighting 的真实分支被环境性假绿掩盖。
          python -m pytest tests/test_signal_*.py -q -rs
